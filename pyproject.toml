[project]
name = "spc-viz"
version = "1.0.0"
description = "SPC Data Visualization for manufacturing quality engineers"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "kaleido>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spc_viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "snapshot: snapshot regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "tests/golden", "tests/diff", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = [".venv/", "tests/golden/", "tests/fixtures/"]
